<!DOCTYPE html>
<meta charset="utf-8">
<title>Witness screenshot relay</title>
<!-- Temporary helper: opens App Store Connect and hands it the screenshots in this folder by postMessage. -->
<button id="go" style="font-size:24px;padding:20px">Open App Store Connect</button>
<pre id="log"></pre>
<script>
const NAMES = ['iphone', 'duo', 'ipad'].flatMap(p => [1, 2, 3, 4].map(n => `${p}_${n}.jpg`));
const ASC = 'https://appstoreconnect.apple.com';
const log = s => document.getElementById('log').textContent += s + '\n';
let blobs = null, acked = false;
document.getElementById('go').onclick = async () => {
  const w = window.open(ASC + '/apps/6838787460/distribution/ios/version/inflight', 'asc');
  blobs = {};
  for (const n of NAMES) blobs[n] = await (await fetch(n)).blob();
  log('loaded ' + NAMES.length + ' files');
  addEventListener('message', e => { if (e.origin === ASC && e.data === 'witness-shots-ack') { acked = true; log('delivered'); } });
  const timer = setInterval(() => { if (acked) return clearInterval(timer); try { w.postMessage({ witnessShots: blobs }, ASC); } catch (e) {} }, 2000);
};
</script>
